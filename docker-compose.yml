services:
  postgres:
    image: postgres:15
    container_name: hris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hris_timeclock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hris_timeclock"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: hris-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hris_timeclock?schema=public
      JWT_SECRET: change_this_secret
      JWT_EXPIRES_IN: 7d
      PHOTO_UPLOAD_DIR: uploads/selfies
      APP_BASE_URL: http://localhost:4000
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres-data: